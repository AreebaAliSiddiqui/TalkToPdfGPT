<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TalktoPdfGPT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Header */

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        /* Upload Card */

        .upload-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .upload-card h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .upload-form {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"] {
            flex: 1;
            min-width: 220px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .primary-button {
            background: #111827;
            color: white;
        }

        .primary-button:hover {
            background: #374151;
        }

        #upload-status {
            margin-top: 14px;
            font-size: 14px;
        }

        /* Active document */

        .document-status {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-size: 14px;
        }

        /* Chat */

        .chat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .chat-header h2 {
            font-size: 20px;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            min-height: 350px;
        }

        .empty-chat {
            height: 100%;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            text-align: center;
        }

        /* Question input */

        .question-area {
            border-top: 1px solid #e5e7eb;
            padding: 16px;
        }

        .question-form {
            display: flex;
            gap: 10px;
        }

        .question-form input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .question-form input:focus {
            border-color: #6b7280;
        }

        /* Messages */

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-message {
            margin-left: auto;
            background: #111827;
            color: white;
        }

        .ai-message {
            margin-right: auto;
            background: #f3f4f6;
            color: #1f2937;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .app {
                padding: 20px 12px;
            }

            .header h1 {
                font-size: 26px;
            }

            .question-form {
                flex-direction: column;
            }

            .question-form button {
                width: 100%;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">
        <h1>TalktoPdfGPT</h1>
        <p>Upload a PDF and ask questions about it.</p>
    </header>


    <!-- Upload -->

    <section class="upload-card">

        <h2>Upload PDF</h2>

        <form id="upload-form" class="upload-form">

            <input
                type="file"
                id="pdf-file"
                name="file"
                accept=".pdf"
                required
            >

            <button
                type="submit"
                class="primary-button"
            >
                Upload PDF
            </button>

        </form>

        <p id="upload-status"></p>

        <div
            id="document-status"
            class="document-status"
        >
            PDF ready. You can now ask questions.
        </div>

    </section>


    <!-- Chat -->

    <section class="chat-card">

        <div class="chat-header">
            <h2>Ask a Question</h2>
        </div>


        <div
            id="chat-messages"
            class="chat-messages"
        >

            <div
                id="empty-chat"
                class="empty-chat"
            >
                <p>
                    Upload a PDF to start chatting with it.
                </p>
            </div>

        </div>


        <!-- Question -->

        <div class="question-area">

            <form
                id="question-form"
                class="question-form"
            >

                <input
                    type="text"
                    id="question"
                    placeholder="Ask something about your PDF..."
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Ask
                </button>

            </form>

        </div>

    </section>

</div>


<script>

    // -------------------------
    // Active Document
    // -------------------------

    let activeDocumentId = null;


    // -------------------------
    // Elements
    // -------------------------

    const uploadForm =
        document.getElementById("upload-form");

    const fileInput =
        document.getElementById("pdf-file");

    const uploadStatus =
        document.getElementById("upload-status");

    const documentStatus =
        document.getElementById("document-status");

    const questionForm =
        document.getElementById("question-form");

    const questionInput =
        document.getElementById("question");

    const chatMessages =
        document.getElementById("chat-messages");

    const emptyChat =
        document.getElementById("empty-chat");


    // -------------------------
    // PDF Upload
    // -------------------------

    uploadForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const file = fileInput.files[0];

            if (!file) {

                uploadStatus.textContent =
                    "Please select a PDF.";

                return;
            }

            uploadStatus.textContent =
                "Uploading and processing PDF...";

            documentStatus.style.display = "none";

            const formData = new FormData();

            formData.append("file", file);


            try {

                const response = await fetch(
                    "/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result =
                    await response.json();


                if (!response.ok) {

                    uploadStatus.textContent =
                        result.error ||
                        "Upload failed.";

                    return;
                }


                activeDocumentId =
                    result.document_id;


                uploadStatus.textContent =
                    "PDF uploaded successfully!";


                documentStatus.style.display =
                    "block";


                console.log(
                    "Active document ID:",
                    activeDocumentId
                );


            } catch (error) {

                uploadStatus.textContent =
                    "Something went wrong while uploading the PDF.";

                console.error(error);
            }

        }
    );


    // -------------------------
    // Ask Question
    // -------------------------

    questionForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const question =
                questionInput.value.trim();


            if (!activeDocumentId) {

                addMessage(
                    "Please upload a PDF first.",
                    "ai-message"
                );

                return;
            }


            if (!question) {

                return;
            }


            addMessage(
                question,
                "user-message"
            );


            questionInput.value = "";


            addMessage(
                "Thinking...",
                "ai-message"
            );


            try {

                const response =
                    await fetch(
                        "/ask",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question,
                                document_id:
                                    activeDocumentId
                            })
                        }
                    );


                const result =
                    await response.json();


                const messages =
                    chatMessages.querySelectorAll(
                        ".ai-message"
                    );

                const loadingMessage =
                    messages[messages.length - 1];


                if (!response.ok) {

                    loadingMessage.textContent =
                        result.error ||
                        "Unable to answer the question.";

                    return;
                }


                loadingMessage.textContent =
                    result.answer;


            } catch (error) {

                const messages =
                    chatMessages.querySelectorAll(
                        ".ai-message"
                    );

                const loadingMessage =
                    messages[messages.length - 1];

                loadingMessage.textContent =
                    "Something went wrong while asking the question.";

                console.error(error);
            }

        }
    );


    // -------------------------
    // Add Chat Message
    // -------------------------

    function addMessage(text, className) {

        if (emptyChat) {
            emptyChat.remove();
        }


        const message =
            document.createElement("div");


        message.classList.add(
            "message",
            className
        );


        message.textContent = text;


        chatMessages.appendChild(message);


        chatMessages.scrollTop =
            chatMessages.scrollHeight;
    }

</script>

</body>
</html>
