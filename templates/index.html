<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TalktoPdfGPT</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">
        <h1>TalktoPdfGPT</h1>
        <p>Upload a PDF and ask questions about it.</p>
    </header>


    <!-- Upload -->

    <section class="upload-card">

        <h2>Upload PDF</h2>

        <form id="upload-form" class="upload-form">

            <input
                type="file"
                id="pdf-file"
                name="file"
                accept=".pdf"
                required
            >

            <button
                type="submit"
                class="primary-button"
            >
                Upload PDF
            </button>

        </form>

        <p id="upload-status"></p>

        <div
            id="document-status"
            class="document-status"
        >
            PDF ready. You can now ask questions.
        </div>

    </section>


    <!-- Chat -->

    <section class="chat-card">

       <div class="chat-header">

    <h2>Ask a Question</h2>

    <button
        id="clear-chat"
        type="button"
        class="secondary-button"
    >
        Clear Chat
    </button>

</div>


        <div
            id="chat-messages"
            class="chat-messages"
        >

            <div
                id="empty-chat"
                class="empty-chat"
            >
                <p>
                    Upload a PDF to start chatting with it.
                </p>
            </div>

        </div>


        <!-- Question -->

        <div class="question-area">

            <form
                id="question-form"
                class="question-form"
            >

                <input
                    type="text"
                    id="question"
                    placeholder="Ask something about your PDF..."
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Ask
                </button>

            </form>

        </div>

    </section>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
